<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLB Betting Dashboard — AI Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: #0e131f;
      --bg-card-hover: #141b2d;
      --border-color: #1e293b;
      --border-glow: #3b82f644;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --blue-accent: #3b82f6;
      --blue-glow: rgba(59, 130, 246, 0.25);
      --amber-accent: #f59e0b;
      --emerald-accent: #10b981;
      --pink-accent: #ec4899;
      --purple-accent: #8b5cf6;
      --red-accent: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.06) 0%, transparent 40%);
      color: var(--text-main);
      padding: 24px 20px;
      min-height: 100vh;
      line-height: 1.5;
    }

    .container { max-width: 1440px; margin: 0 auto; }

    /* Header styling */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      font-size: 2rem;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.2));
    }

    .badge-ai {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    .header-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Controls & Toolbar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 24px;
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn:hover {
      background: #334155;
      border-color: var(--blue-accent);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .btn-outline {
      background: transparent;
      border-color: #334155;
    }

    .btn-outline.active {
      background: #1e293b;
      border-color: var(--blue-accent);
      color: #60a5fa;
    }

    .input-date, .select-model {
      background: #0b0f19;
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
    }

    .input-date:focus, .select-model:focus {
      border-color: var(--blue-accent);
      box-shadow: 0 0 0 2px var(--blue-glow);
    }

    /* Stats summary strip */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--blue-accent);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .stat-val {
      font-size: 1.45rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Filter pills */
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-pill {
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 9999px;
      background: #141c2b;
      border: 1px solid #1e293b;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-pill:hover, .filter-pill.active {
      background: #1e293b;
      color: #fff;
      border-color: var(--blue-accent);
    }

    /* Table Container */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #111827;
      padding: 14px 18px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 16px 18px;
      border-bottom: 1px solid #172033;
      vertical-align: middle;
      font-size: 0.9rem;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-card-hover); }

    /* Matchup Column */
    .matchup-box { display: flex; flex-direction: column; gap: 4px; }
    .teams { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
    .team-away { color: #fde047; }
    .vs-tag { color: var(--text-dim); font-size: 0.75rem; font-weight: 400; }
    .team-home { color: #93c5fd; }
    .starters { font-size: 0.8rem; color: var(--text-muted); }
    .venue-info { font-size: 0.75rem; color: var(--text-dim); }

    /* Odds */
    .odds-box {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .odds-ml { color: #facc15; }
    .odds-tot { color: #60a5fa; }

    /* Pick Badges */
    .pick-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 6px 14px;
      border-radius: 10px;
      letter-spacing: -0.01em;
    }

    .pick-home {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.15);
    }

    .pick-away {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
    }

    .pick-over {
      background: rgba(236, 72, 153, 0.15);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.4);
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.15);
    }

    .pick-under {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 129 rgba(16, 185, 129, 0.15);
    }

    /* Confidence Meter */
    .conf-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 100px;
    }

    .conf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .conf-bar-bg {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 9999px;
      overflow: hidden;
    }

    .conf-bar-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #3b82f6, #10b981);
    }

    .edge-tag {
      font-size: 0.72rem;
      color: #34d399;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Rationale */
    .reason-box {
      font-size: 0.84rem;
      color: #cbd5e1;
      line-height: 1.45;
      max-width: 380px;
    }

    .score-proj {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 4px;
      background: #141d2e;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    /* Model Tag */
    .model-tag {
      font-size: 0.72rem;
      background: #141c2c;
      border: 1px solid #243048;
      padding: 3px 8px;
      border-radius: 6px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }

    /* Loading and Status */
    .loading-state {
      padding: 60px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #1e293b;
      border-top-color: var(--blue-accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alert Banner */
    .alert-banner {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr {
        margin-bottom: 18px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
      }
      td {
        border-bottom: 1px solid #172033;
        padding: 10px 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      td::before {
        content: attr(data-label);
        font-size: 0.75rem;
        text-transform: uppercase;
        color: #64748b;
        font-weight: 600;
      }
      .reason-box { max-width: 100%; text-align: right; }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <header class="header">
    <div>
      <div class="brand-title">
        <span class="brand-icon">⚾</span>
        MLB Betting Dashboard
        <span class="badge-ai">AI Model Picker</span>
      </div>
      <div class="header-desc">
        Real-time MLB game predictions and sharp EV edge analysis powered by 9Router & Sabermetric AI
      </div>
    </div>
    <div class="header-actions">
      <a href="/" class="btn btn-outline">🏠 Classic Slate</a>
      <button class="btn btn-primary" onclick="fetchSlate()">
        <span>⟳</span> Refresh Slate & Picks
      </button>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="date-nav">
      <button class="btn" onclick="changeDate(-1)">‹ Prev</button>
      <input type="date" id="slateDate" class="input-date" onchange="onDateChange()" />
      <button class="btn" onclick="changeDate(1)">Next ›</button>
      <button class="btn btn-outline" onclick="setDateToToday()">Today</button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
      <label style="font-size: 0.82rem; color: var(--text-muted); font-weight: 500;">AI Engine:</label>
      <select id="modelSelect" class="select-model" onchange="onModelChange()">
        <option value="auto">🔄 Auto Multi-Model Rotation</option>
        <option value="xkiro/openai/gpt-5.6-sol">GPT-5.6 Sol (Deep Reasoning)</option>
        <option value="xkiro/anthropic/claude-fable-5">Claude Fable 5 (Sabermetric Sharp)</option>
        <option value="xkiro/deepseek/deepseek-v4-flash-0731">DeepSeek v4 Flash (Speed & Odds)</option>
        <option value="tb/deepseek-v4-pro">DeepSeek v4 Pro (High Conviction)</option>
        <option value="zai/openai/gpt-5.6-sol">ZAI OpenAI GPT-5.6</option>
        <option value="zai/anthropic/claude-fable-5">ZAI Claude Fable</option>
      </select>
    </div>

    <!-- Filters -->
    <div class="filter-group">
      <button class="filter-pill active" onclick="setFilter('all', this)">All Games</button>
      <button class="filter-pill" onclick="setFilter('ml', this)">Moneyline</button>
      <button class="filter-pill" onclick="setFilter('ou', this)">Over / Under</button>
      <button class="filter-pill" onclick="setFilter('high_conf', this)">⭐ High AI Rating (70+)</button>
    </div>
  </div>

  <!-- Stats Strip -->
  <div class="stats-strip" id="statsStrip">
    <div class="stat-card">
      <span class="stat-label">Total Slate Games</span>
      <span class="stat-val" id="statGamesCount">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Framework Picks</span>
      <span class="stat-val" id="statPicksCount" style="color: #60a5fa;">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Average AI Rating</span>
      <span class="stat-val" id="statAvgConf" style="color: #34d399;">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">External AI Picks</span>
      <span class="stat-val" id="statHighConf" style="color: #fbbf24;">—</span>
    </div>
  </div>

  <!-- Error Banner Container -->
  <div id="errorBanner" style="display: none;"></div>

  <!-- App Content -->
  <div id="app">
    <div class="loading-state">
      <div class="spinner"></div>
      <div>Loading today's slate and initializing AI Picker...</div>
    </div>
  </div>
</div>

<script>
// Get relative base origin to handle subdomains and subfolders cleanly
const BASE_ORIGIN = window.location.origin;
const PICKER_URL = `${BASE_ORIGIN}/api/pick`;

const MODELS = [
  'xkiro/openai/gpt-5.6-sol',
  'xkiro/anthropic/claude-fable-5',
  'xkiro/deepseek/deepseek-v4-flash-0731',
  'tb/deepseek-v4-pro',
  'zai/openai/gpt-5.6-sol',
  'zai/anthropic/claude-fable-5'
];

function currentMlbDate() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date());
  const value = Object.fromEntries(parts.map(part => [part.type, part.value]));
  return `${value.year}-${value.month}-${value.day}`;
}

let currentDate = currentMlbDate();
let currentFilter = 'all';
let currentResults = [];

function starterForSide(game, side) {
  const observations = game.probableStarterObservations || [];
  return observations.find(item => item.side === side)
    || observations[side === 'away' ? 0 : 1]
    || null;
}

function parseRunOutput(run) {
  if (!run || !run.outputJson) return {};
  if (typeof run.outputJson === 'object') return run.outputJson;
  try { return JSON.parse(run.outputJson); } catch (_) { return {}; }
}

function analysisForGame(game) {
  const latest = new Map();
  for (const run of game.modelRuns || []) {
    if (!latest.has(run.modelId)) latest.set(run.modelId, run);
  }
  const mlRun = latest.get('ML_COMBO_V2');
  const ouRun = latest.get('OU_UNIFIED');
  const ml = parseRunOutput(mlRun);
  const ou = parseRunOutput(ouRun);
  return {
    moneyline: mlRun ? {
      finalState: mlRun.finalState,
      rawScore: mlRun.rawScore,
      candidateTeamName: ml.candidateTeamName,
      candidateDecimalOdds: ml.candidateDecimalOdds,
      hardGates: ml.hardGates || [],
      warnings: ml.warnings || []
    } : null,
    totals: ouRun ? {
      finalState: ouRun.finalState,
      rawGap: ouRun.rawGap,
      selectedSide: ou.selectedSide,
      selectedPrice: ou.selectedPrice,
      marketLine: ou.marketLine,
      dataQualityScore: ou.dataQualityScore,
      hardGates: ou.hardGates || [],
      warnings: ou.warnings || []
    } : null
  };
}

function marketForGame(game) {
  const snap = game.marketSnapshots?.[0] || {};
  const awayCode = game.awayTeam?.abbreviation || 'AWAY';
  const homeCode = game.homeTeam?.abbreviation || 'HOME';
  const moneyline = snap.moneyline
    || (snap.moneylineAway != null && snap.moneylineHome != null
      ? `${awayCode} ${snap.moneylineAway} / ${homeCode} ${snap.moneylineHome}`
      : 'Unavailable');
  const total = snap.total
    || (snap.totalLine != null
      ? `${snap.totalLine}${snap.totalOverDecimal != null && snap.totalUnderDecimal != null
        ? ` (O ${snap.totalOverDecimal} / U ${snap.totalUnderDecimal})`
        : ''}`
      : 'Unavailable');
  return { snap, moneyline, total };
}

async function runWithConcurrency(items, limit, worker) {
  let nextIndex = 0;
  const runners = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (nextIndex < items.length) {
      const index = nextIndex++;
      await worker(items[index], index);
    }
  });
  await Promise.all(runners);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  })[char]);
}

// Initialize date input
document.getElementById('slateDate').value = currentDate;

function setDateToToday() {
  currentDate = currentMlbDate();
  document.getElementById('slateDate').value = currentDate;
  fetchSlate();
}

function changeDate(days) {
  const d = new Date(currentDate);
  d.setDate(d.getDate() + days);
  currentDate = d.toISOString().slice(0, 10);
  document.getElementById('slateDate').value = currentDate;
  fetchSlate();
}

function onDateChange() {
  const val = document.getElementById('slateDate').value;
  if (val) {
    currentDate = val;
    fetchSlate();
  }
}

function onModelChange() {
  fetchSlate();
}

function setFilter(filterType, element) {
  currentFilter = filterType;
  document.querySelectorAll('.filter-pill').forEach(el => el.classList.remove('active'));
  if (element) element.classList.add('active');
  renderResults();
}

async function fetchSlate() {
  const app = document.getElementById('app');
  const errorBanner = document.getElementById('errorBanner');
  errorBanner.style.display = 'none';

  app.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <div>Fetching games for ${currentDate} & generating AI picks...</div>
    </div>
  `;

  try {
    const slateUrl = `${BASE_ORIGIN}/api/slates/${currentDate}`;
    const resp = await fetch(slateUrl);
    
    if (!resp.ok) {
      throw new Error(`Failed to load slate (${resp.status} ${resp.statusText})`);
    }

    const data = await resp.json();
    const games = data.games || [];

    if (!games.length) {
      app.innerHTML = `
        <div class="table-container" style="padding: 48px; text-align: center; color: var(--text-muted);">
          <div style="font-size: 2.5rem; margin-bottom: 12px;">⚾</div>
          <h3 style="color: var(--text-main); margin-bottom: 8px;">No games scheduled for ${currentDate}</h3>
          <p>Try switching to another date or refreshing the slate.</p>
        </div>
      `;
      updateStats([], []);
      return;
    }

    const selectedModelSetting = document.getElementById('modelSelect').value;

    // Render every game immediately, then fill picks progressively. This keeps
    // one slow provider/model from leaving an empty table on screen.
    currentResults = games.map((game, idx) => ({
      game,
      payload: null,
      result: null,
      parsed: null,
      model: selectedModelSetting === 'auto' ? MODELS[idx % MODELS.length] : selectedModelSetting,
      error: null,
      loading: true
    }));
    renderResults();

    await runWithConcurrency(games, 3, async (game, idx) => {
      const model = selectedModelSetting === 'auto' ? MODELS[idx % MODELS.length] : selectedModelSetting;
      const awayName = game.awayTeam?.name || 'Unknown Away';
      const homeName = game.homeTeam?.name || 'Unknown Home';
      const awayStarter = starterForSide(game, 'away');
      const homeStarter = starterForSide(game, 'home');
      const awaySp = awayStarter?.person?.fullName || awayStarter?.person?.name || 'TBD';
      const homeSp = homeStarter?.person?.fullName || homeStarter?.person?.name || 'TBD';
      const { moneyline, total } = marketForGame(game);

      const payload = {
        gameId: game.id,
        away: awayName,
        away_sp: awaySp,
        home: homeName,
        home_sp: homeSp,
        moneyline,
        total,
        model,
        venue: game.venue?.name || '',
        analysis: analysisForGame(game)
      };

      try {
        const pickResp = await fetch(PICKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await pickResp.json();
        if (!pickResp.ok || result.ok === false) {
          throw new Error(result.error || `Picker HTTP ${pickResp.status}`);
        }
        let parsed = result;

        if (result.result && typeof result.result === 'string') {
          try {
            const jsonMatch = result.result.match(/\{[\s\S]*\}/);
            if (jsonMatch) parsed = { ...result, ...JSON.parse(jsonMatch[0]) };
          } catch (_) {}
        }

        currentResults[idx] = { game, payload, result, parsed, model, error: null, loading: false };
      } catch (err) {
        currentResults[idx] = { game, payload, result: null, parsed: null, model, error: err.message, loading: false };
      }
      renderResults();
    });

  } catch (err) {
    console.error('Fetch error:', err);
    errorBanner.style.display = 'flex';
    errorBanner.className = 'alert-banner';
    errorBanner.innerHTML = `
      <div><strong>Notice:</strong> ${err.message}. Please check connection or try refreshing.</div>
      <button class="btn btn-outline" onclick="fetchSlate()">Try Again</button>
    `;
    app.innerHTML = `
      <div class="table-container" style="padding: 40px; text-align: center; color: #f87171;">
        <h3>Could not load games</h3>
        <p style="margin-top: 8px; color: var(--text-muted);">${err.message}</p>
        <button class="btn btn-primary" style="margin-top: 16px;" onclick="fetchSlate()">⟳ Retry</button>
      </div>
    `;
  }
}

function updateStats(results, filtered) {
  document.getElementById('statGamesCount').textContent = results.length;
  document.getElementById('statPicksCount').textContent = results.filter(r =>
    !r.error && r.parsed?.framework?.actionable
  ).length;

  const validConfs = results
    .filter(r => r.parsed?.confidenceType === 'ai-opinion' && typeof r.parsed.confidence === 'number')
    .map(r => r.parsed.confidence);
  const avg = validConfs.length ? Math.round(validConfs.reduce((a, b) => a + b, 0) / validConfs.length) : 0;
  document.getElementById('statAvgConf').textContent = avg ? `${avg}/100` : '—';

  const aiPicks = results.filter(r =>
    !r.error && r.parsed?.source === 'llm' && r.parsed?.actionable !== false && r.parsed?.pick && r.parsed.pick !== 'NO PICK'
  ).length;
  document.getElementById('statHighConf').textContent = aiPicks;
}

function renderResults() {
  const app = document.getElementById('app');
  let items = currentResults;

  if (currentFilter === 'ml') {
    items = items.filter(r => r.parsed?.pick?.toLowerCase().includes('ml'));
  } else if (currentFilter === 'ou') {
    items = items.filter(r => r.parsed?.pick?.toLowerCase().includes('over') || r.parsed?.pick?.toLowerCase().includes('under'));
  } else if (currentFilter === 'high_conf') {
    items = items.filter(r => (r.parsed?.confidence || 0) >= 70);
  }

  updateStats(currentResults, items);

  if (!items.length) {
    app.innerHTML = `
      <div class="table-container" style="padding: 48px; text-align: center; color: var(--text-muted);">
        <h3>No games match the selected filter</h3>
      </div>
    `;
    return;
  }

  let html = `
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Matchup & Starters</th>
            <th>Market Odds</th>
            <th>Framework Pick</th>
            <th>AI Review</th>
            <th>AI Rating & Verdict</th>
            <th>AI Rationale</th>
            <th>AI Model</th>
          </tr>
        </thead>
        <tbody>
  `;

  for (const r of items) {
    const g = r.game;
    const home = g.homeTeam?.name || 'Home Team';
    const away = g.awayTeam?.name || 'Away Team';
    const homeStarter = starterForSide(g, 'home');
    const awayStarter = starterForSide(g, 'away');
    const homeSP = homeStarter?.person?.fullName || homeStarter?.person?.name || 'TBD';
    const awaySP = awayStarter?.person?.fullName || awayStarter?.person?.name || 'TBD';
    const { moneyline: ml, total } = marketForGame(g);
    const venue = g.venue?.name || '';

    let pickDisplay = '—';
    let confidence = 0;
    let reason = '—';
    let pickClass = '';
    let projectedScore = '';
    let valueEdge = '';
    let modelName = (r.model.split('/').pop() || r.model).replace('-flash-0731', '');
    let confidenceLabel = '—';
    let framework = null;
    let verdict = '';

    if (r.loading) {
      pickDisplay = 'Analyzing…';
      reason = 'Waiting for the selected model…';
      pickClass = 'pick-home';
    } else if (r.error) {
      reason = `Error: ${r.error}`;
    } else if (r.parsed) {
      const p = r.parsed;
      pickDisplay = p.pick || '—';
      confidence = Number(p.confidence) || 0;
      reason = p.reason || '—';
      projectedScore = p.projectedScore || '';
      valueEdge = p.valueEdge || p.marketEdge || '';
      modelName = p.model || modelName;
      framework = p.framework || null;
      verdict = p.verdict || '';
      confidenceLabel = p.confidenceType === 'model-score'
        ? `${confidence} score`
        : p.confidenceType === 'data-quality'
        ? `${confidence} quality`
        : confidence
        ? `${confidence}/100`
        : '—';

      const pickLower = String(pickDisplay).toLowerCase();
      if (pickLower.includes('away')) pickClass = 'pick-away';
      else if (pickLower.includes('home')) pickClass = 'pick-home';
      else if (pickLower.includes('over')) pickClass = 'pick-over';
      else if (pickLower.includes('under')) pickClass = 'pick-under';
      else pickClass = 'pick-home';
    }

    html += `
      <tr>
        <td data-label="Matchup">
          <div class="matchup-box">
            <div class="teams">
              <span class="team-away">${escapeHtml(away)}</span>
              <span class="vs-tag">@</span>
              <span class="team-home">${escapeHtml(home)}</span>
            </div>
            <div class="starters">SP: ${escapeHtml(awaySP)} vs ${escapeHtml(homeSP)}</div>
            ${venue ? `<div class="venue-info">📍 ${escapeHtml(venue)}</div>` : ''}
          </div>
        </td>
        <td data-label="Odds">
          <div class="odds-box">
            <div class="odds-ml">ML: ${escapeHtml(ml)}</div>
            <div class="odds-tot">O/U: ${escapeHtml(total)}</div>
          </div>
        </td>
        <td data-label="AI Pick">
          <div style="font-weight:700;color:${framework?.actionable ? '#60a5fa' : '#94a3b8'}">${escapeHtml(framework?.pick || (r.loading ? 'Calculating…' : '—'))}</div>
          ${framework ? `<div style="font-size:.72rem;color:#94a3b8;margin-top:3px">${escapeHtml(framework.state)}${framework.score != null ? ` · ${escapeHtml(framework.score)} ${framework.scoreType === 'data-quality' ? 'quality' : 'score'}` : ''}</div><div style="font-size:.7rem;color:#64748b;margin-top:3px">${escapeHtml(framework.reason)}</div>` : ''}
        </td>
        <td data-label="AI Review">
          <span class="pick-badge ${pickClass}">
            <span>🎯</span> ${escapeHtml(pickDisplay)}
          </span>
          ${projectedScore ? `<div class="score-proj">Proj: ${escapeHtml(projectedScore)}</div>` : ''}
        </td>
        <td data-label="Confidence">
          <div class="conf-container">
            <div class="conf-header">
              <span>${confidenceLabel}</span>
              ${valueEdge ? `<span class="edge-tag">${escapeHtml(valueEdge)}</span>` : ''}
            </div>
            <div class="conf-bar-bg">
              <div class="conf-bar-fill" style="width: ${confidence}%;"></div>
            </div>
            ${verdict ? `<span class="model-tag" style="margin-top:6px;color:${verdict === 'AGREE' ? '#34d399' : verdict === 'DISAGREE' ? '#fbbf24' : verdict === 'UNAVAILABLE' ? '#f87171' : '#94a3b8'}">${escapeHtml(verdict)}</span>` : ''}
          </div>
        </td>
        <td data-label="Reason">
          <div class="reason-box">${escapeHtml(reason)}</div>
        </td>
        <td data-label="Model">
          <span class="model-tag">${escapeHtml(modelName)} · ${r.parsed?.source === 'llm' ? 'external AI' : 'unavailable'}</span>
        </td>
      </tr>
    `;
  }

  html += `
        </tbody>
      </table>
    </div>
  `;

  app.innerHTML = html;
}

// Initial fetch on page load
fetchSlate();
</script>
</body>
</html>
